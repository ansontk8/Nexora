<div id="chatbot-widget"
    style="position: fixed; bottom: 30px; right: 30px; z-index: 9999; font-family: 'Inter', sans-serif;">
    <!-- Neural Pulsing Background -->
    <div id="neural-pulse"
        style="position: absolute; top: 0; left: 0; width: 60px; height: 60px; background: var(--primary); border-radius: 50%; opacity: 0.3; filter: blur(15px); animation: pulse 2s infinite; display: block;">
    </div>

    <!-- Chat Toggle Button -->
    <button id="chat-toggle" class="btn btn-primary"
        style="border-radius: 50%; width: 60px; height: 60px; justify-content: center; position: relative; z-index: 10000; box-shadow: 0 10px 40px rgba(99, 102, 241, 0.4); border: 2px solid rgba(255,255,255,0.1);">
        <i class="fas fa-sparkles" style="font-size: 1.5rem; transition: transform 0.3s ease;"></i>
    </button>

    <!-- Neural Chat Interface -->
    <div id="chat-window" class="glass"
        style="display: none; position: absolute; bottom: 85px; right: 0; width: 380px; height: 500px; flex-direction: column; overflow: hidden; animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1); border-radius: 24px; box-shadow: 0 20px 80px rgba(0,0,0,0.5);">

        <!-- Neural Header -->
        <div
            style="padding: 1.5rem; border-bottom: 1px solid var(--glass-border); display: flex; justify-content: space-between; align-items: center; background: linear-gradient(to right, rgba(99, 102, 241, 0.15), rgba(139, 92, 246, 0.15)); backdrop-filter: blur(20px);">
            <div style="display: flex; align-items: center; gap: 1rem;">
                <div style="position: relative;">
                    <div
                        style="width: 12px; height: 12px; background: #10b981; border-radius: 50%; box-shadow: 0 0 10px #10b981;">
                    </div>
                    <div
                        style="position: absolute; top: 0; left: 0; width: 12px; height: 12px; background: #10b981; border-radius: 50%; animation: pulse-small 1.5s infinite;">
                    </div>
                </div>
                <div>
                    <div style="font-size: 0.95rem; font-weight: 800; color: var(--text-main); letter-spacing: 0.05em;">
                        NEXA CHAT</div>
                    <div
                        style="font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase; font-weight: 700;">
                        Online</div>
                </div>
            </div>
            <button onclick="toggleChat()"
                style="background: none; border: none; color: var(--text-dim); cursor: pointer; padding: 0.5rem; transition: color 0.3s;"
                onmouseover="this.style.color='white'" onmouseout="this.style.color='var(--text-dim)'">
                <i class="fas fa-xmark" style="font-size: 1.25rem;"></i>
            </button>
        </div>

        <!-- Neural Message Stream -->
        <div id="chat-messages"
            style="flex-grow: 1; padding: 1.5rem; overflow-y: auto; display: flex; flex-direction: column; gap: 1.25rem; background: rgba(0,0,0,0.2);">
            <div class="message-bot"
                style="background: rgba(255,255,255,0.05); padding: 1rem 1.25rem; border-radius: 18px 18px 18px 4px; font-size: 0.9rem; max-width: 85%; color: var(--text-main); line-height: 1.5; border: 1px solid var(--glass-border);">
                Hi! I'm Nexa, your AI assistant. How can I help you today?
            </div>
        </div>

        <!-- Neural Input Terminal -->
        <div style="padding: 1.5rem; border-top: 1px solid var(--glass-border); background: rgba(2, 6, 23, 0.6);">
            <div
                style="display: flex; gap: 0.75rem; background: rgba(255,255,255,0.03); padding: 0.5rem; border-radius: 50px; border: 1px solid var(--glass-border);">
                <input type="text" id="chat-input" placeholder="Ask me anything..."
                    style="background: none; border: none; color: white; flex-grow: 1; padding: 0.5rem 1rem; font-size: 0.9rem; outline: none;">
                <button id="send-btn" onclick="sendChatMessage()" class="btn btn-primary"
                    style="width: 40px; height: 40px; min-width: 40px; border-radius: 50%; padding: 0; justify-content: center;">
                    <i class="fas fa-arrow-up" style="font-size: 0.9rem;"></i>
                </button>
            </div>
            <div
                style="text-align: center; font-size: 0.6rem; color: var(--text-dim); margin-top: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em;">
                Powered by Groq LPU
            </div>
        </div>
    </div>
</div>

<style>
    @keyframes pulse {
        0% { transform: scale(1); opacity: 0.3; }
        50% { transform: scale(1.4); opacity: 0.1; }
        100% { transform: scale(1); opacity: 0.3; }
    }
    @keyframes pulse-small {
        0% { transform: scale(1); opacity: 0.8; }
        100% { transform: scale(2.5); opacity: 0; }
    }

    @media (max-width: 768px) {
        #chatbot-widget {
            bottom: 90px !important; /* Move above the mobile bottom nav */
            right: 20px !important;
        }

        #chat-window {
            width: calc(100vw - 40px) !important;
            right: 0 !important;
            max-height: 60vh !important;
            bottom: 75px !important;
        }
    }
</style>

<script>
    const chatToggle = document.getElementById('chat-toggle');
    const chatWindow = document.getElementById('chat-window');
    const chatInput = document.getElementById('chat-input');
    const chatMessages = document.getElementById('chat-messages');
    const toggleIcon = chatToggle.querySelector('i');

    function toggleChat() {
        const isOpening = chatWindow.style.display === 'none' || chatWindow.style.display === '';
        chatWindow.style.display = isOpening ? 'flex' : 'none';
        toggleIcon.style.transform = isOpening ? 'rotate(180deg)' : 'rotate(0deg)';
        toggleIcon.className = isOpening ? 'fas fa-chevron-down' : 'fas fa-sparkles';
    }

    chatToggle.onclick = toggleChat;

    chatInput.onkeypress = (e) => {
        if (e.key === 'Enter') sendChatMessage();
    };

    function sendChatMessage() {
        const text = chatInput.value.trim();
        if (!text) return;

        // Append User Message
        appendMessage('user', text);
        chatInput.value = '';

        // Append Thinking Message
        const loadingDiv = appendMessage('bot', '<i class="fas fa-spinner fa-spin" style="margin-right: 0.75rem;"></i> Thinking...', true);

        fetch("{% url 'chat_api' %}", {
            method: "POST",
            headers: { 
                'Content-Type': 'application/json',
                'X-CSRFToken': '{{ csrf_token }}'
            },
            body: JSON.stringify({ message: text })
        })
        .then(res => res.json())
        .then(data => {
            if (data.response) {
                loadingDiv.innerHTML = formatBotMessage(data.response);
                loadingDiv.style.color = 'var(--text-main)';
            } else {
                loadingDiv.innerHTML = "I encountered an issue processing that. Please try again.";
            }
            chatMessages.scrollTop = chatMessages.scrollHeight;
        })
        .catch(err => {
            console.error(err);
            loadingDiv.innerHTML = '<span style="color: var(--danger);">Connection error. Please try again later.</span>';
        });
    }

    function appendMessage(role, content, isLoading = false) {
        const div = document.createElement('div');
        div.className = role === 'user' ? '' : 'message-bot';
        
        if (role === 'user') {
            div.style.alignSelf = 'flex-end';
            div.style.background = 'var(--primary)';
            div.style.padding = '0.75rem 1.25rem';
            div.style.borderRadius = '18px 18px 4px 18px';
            div.style.fontSize = '0.9rem';
            div.style.maxWidth = '85%';
            div.style.color = 'white';
            div.style.boxShadow = '0 10px 20px rgba(99, 102, 241, 0.2)';
        } else {
            div.style.background = 'rgba(255,255,255,0.05)';
            div.style.padding = '1rem 1.25rem';
            div.style.borderRadius = '18px 18px 18px 4px';
            div.style.fontSize = '0.9rem';
            div.style.maxWidth = '85%';
            div.style.color = 'var(--text-main)';
            div.style.border = '1px solid var(--glass-border)';
            if (isLoading) div.style.color = 'var(--text-dim)';
        }

        div.innerHTML = content;
        chatMessages.appendChild(div);
        chatMessages.scrollTop = chatMessages.scrollHeight;
        return div;
    }

    function formatBotMessage(text) {
        return text
            .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
            .replace(/\n/g, '<br>')
            .replace(/• (.*?)(<br>|$)/g, '<li>$1</li>');
    }
</script>
